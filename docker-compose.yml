services:
  backend: 
    build: ./backend
    container_name: task-manager-backend
    restart: always
    env_file: 
       - ./backend/.env
    ports: 
       - "5000:5000"

  frontend:
    build: ./frontend
    container_name: task-manager-frontend
    restart: always
    ports: 
      - "5173:5173"
    depends_on:   
      - backend         